[project]
name = "msna-2025-form-template-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10.9"
dependencies = [
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
    "pyarrow>=18.0.0",
    "loguru>=0.7.0",
    "typer>=0.15.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
kmta = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
