      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "7b1e90eaaa3a8add5264ef130d51b67c", "console": [], "id": "Hbol", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"msna-2025-country-compliance-analysis\"\u003EMSNA 2025: Country Compliance Analysis\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EObjective\u003C/strong\u003E: Analyze template compliance across 14 country MSNAs to identify gaps,\nstandardization issues, and potential improvements for the 2025 MSNA cycle.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThis analysis covers:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003EColumn presence analysis\u003C/li\u003E\n\u003Cli\u003EIndicator matching across countries\u003C/li\u003E\n\u003Cli\u003EFuzzy matching for typo detection\u003C/li\u003E\n\u003C/ol\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "822e580d74bdd5f36474a31aa90efff7", "console": [], "id": "MJUe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "c808e73b77891b126d069f3dc2ba116c", "console": [], "id": "vblA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"data-overview\"\u003EData Overview\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EProjects analyzed\u003C/strong\u003E: 14\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ECountries\u003C/strong\u003E: 10\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ETotal questions in database\u003C/strong\u003E: 7,636\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ETemplate indicators\u003C/strong\u003E: 247\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "83f356c9a638b960e7d2279f719184b6", "console": [], "id": "bkHC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Chr /\u003E\n\u003Ch2 id=\"1-column-presence-analysis\"\u003E1. Co
