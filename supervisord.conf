[supervisord]
nodaemon=true
user=root

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_err.log

[program:notebooks]
command=/app/start-notebooks.sh
user=msnauser
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/notebooks.log
stderr_logfile=/var/log/supervisor/notebooks_err.log
environment=PATH="/app/.venv/bin:%(ENV_PATH)s",PYTHONPATH="/app"
